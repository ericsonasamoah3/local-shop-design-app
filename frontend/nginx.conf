server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default is 1MB, which rejected ordinary phone photos with a
    # 413 before they ever reached the backend. Match the backend's own
    # ceiling (express.json limit, 15mb) — uploads are capped at 5MB there,
    # and composite requests carry a base64 mask on top of that.
    client_max_body_size 15m;

    # In AWS every request arrives from API Gateway's VPC link, so
    # $remote_addr is the link, not the visitor. API Gateway puts the
    # visitor's IP in x-client-ip (terraform/https.tf); swap it in so the
    # X-Real-IP passed to the backend, and so the per-client spend cap, is
    # per visitor again. Trusted only from inside the VPC (vpc_cidr in
    # terraform/variables.tf) -- the tasks accept no traffic from anywhere
    # else, so a visitor cannot forge it. Locally under Docker Compose no
    # request comes from that range and this does nothing.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header   x-client-ip;

    # Frontend app (React build output)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded photos — this was the missing piece behind the original
    # "uploaded image not showing" bug. /api/ alone does NOT cover this;
    # it needs its own location block pointing at the backend, which
    # serves this path from the shared uploads volume.
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Mocked (Phase 1) / real (Phase 2) composite images — same reasoning
    # as /uploads/ above.
    location /composites/ {
        proxy_pass http://backend:3001/composites/;
        proxy_set_header Host $host;
    }
}
