name: Terraform

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-north-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
          role-session-name: ${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Baseline config lives in terraform/ci.auto.tfvars, which Terraform
      # loads automatically. The REPLICATE_MODEL_VERSION repo variable is an
      # OPTIONAL override, so the model can be swapped from the GitHub UI
      # without a commit.
      #
      # The override is only passed when it is non-empty. This matters: an
      # unset repo variable renders as "", and an explicit -var="" beats the
      # value from a tfvars file. Passing it unconditionally is what wrote an
      # empty model version into every deploy and made the backend refuse
      # every composite. Keep the guard.
      #
      # If you do set the override, update backend_env in ci.auto.tfvars to
      # match the new model's input schema -- the two belong together, and the
      # check block in variables.tf warns when they disagree.
      - name: Terraform Plan
        id: plan
        env:
          MODEL_OVERRIDE: ${{ vars.REPLICATE_MODEL_VERSION }}
        run: |
          OVERRIDE=()
          if [ -n "$MODEL_OVERRIDE" ]; then
            OVERRIDE=(-var="replicate_model_version=$MODEL_OVERRIDE")
            echo "Model override from repo variable: $MODEL_OVERRIDE"
          else
            echo "No model override set; using terraform/ci.auto.tfvars"
          fi
          terraform plan -no-color -input=false \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="replicate_api_token=${{ secrets.REPLICATE_API_TOKEN }}" \
            "${OVERRIDE[@]}" \
            -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.slice(0, 65000)
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
